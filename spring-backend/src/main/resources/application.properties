spring.application.name=spring-backend
server.port=8080

# Local MySQL connection. Set DB_USERNAME and DB_PASSWORD in your terminal.
spring.datasource.url=jdbc:mysql://localhost:3306/ecoconnect_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For this development project, Hibernate creates/updates tables from JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Admins cannot self-register unless this secret is configured in the backend environment.
app.admin-registration-key=${ADMIN_REGISTRATION_KEY:}

# Fixed administrator account for local/demo use. Override ADMIN_EMAIL and ADMIN_PASSWORD before deployment.
app.admin.email=${ADMIN_EMAIL:admin@ecoconnect.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@123}
